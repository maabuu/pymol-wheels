name: 'Find Latest Successful Build Run'
description: 'Finds the latest successful build workflow run or uses a provided run ID'

inputs:
  build_run_id:
    description: 'Specific build run ID to use (optional)'
    required: false
    default: ''
  allow_partial:
    description: 'Without a run ID, use the latest completed build run even if not all of its jobs succeeded'
    required: false
    default: 'false'

outputs:
  run-id:
    description: 'The build workflow run ID to use'
    value: ${{ steps.find-build.outputs.run-id }}

runs:
  using: 'composite'
  steps:
    - name: Find latest successful build run
      id: find-build
      uses: actions/github-script@v9
      env:
        BUILD_RUN_ID: ${{ inputs.build_run_id }}
        ALLOW_PARTIAL: ${{ inputs.allow_partial }}
      with:
        script: |
          const buildRunId = (process.env.BUILD_RUN_ID || '').trim();

          if (buildRunId) {
            console.log(`Using provided build run ID: ${buildRunId}`);
            core.setOutput('run-id', buildRunId);
            return;
          }

          // A completed run may have failed or been cancelled.
          const status = process.env.ALLOW_PARTIAL === 'true' ? 'completed' : 'success';
          const wanted = status === 'success' ? 'successful' : 'completed';

          console.log(`Finding latest ${wanted} build workflow run...`);

          const { data: runs } = await github.rest.actions.listWorkflowRuns({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'build.yml',
            status,
            per_page: 1
          });

          if (runs.workflow_runs.length === 0) {
            core.setFailed(`No ${wanted} build workflow runs found`);
            return;
          }

          const latestRun = runs.workflow_runs[0];
          console.log(`Found latest ${wanted} build run: ${latestRun.id} from ${latestRun.created_at}`);
          core.setOutput('run-id', latestRun.id);
