name: publish

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build workflow run ID (optional - will use latest successful if not provided)"
        required: false
        type: string
      publish_to_pypi:
        description: "Publish wheels to PyPI"
        required: false
        default: false
        type: boolean
      publish_to_testpypi:
        description: "Publish wheels to TestPyPI"
        required: false
        default: true
        type: boolean

jobs:
  find-build:
    name: Find Build Run
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.find-build.outputs.run-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Find build run
        id: find-build
        uses: ./.github/actions/find-build-run
        with:
          build_run_id: ${{ inputs.build_run_id }}

  publish:
    name: Publish Wheels to PyPI
    needs: find-build
    permissions:
      id-token: write
      actions: read
      contents: read
    runs-on: ubuntu-latest
    if: inputs.publish_to_pypi
    environment:
      name: pypi
      url: https://pypi.org/p/pymol-open-source

    steps:
      - name: Download wheels from build workflow
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.find-build.outputs.run-id }}
          pattern: pymol-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true

  publish-to-testpypi:
    name: Publish Wheels to TestPyPI
    needs: find-build
    permissions:
      id-token: write
      actions: read
      contents: read
    runs-on: ubuntu-latest
    if: inputs.publish_to_testpypi
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pymol-open-source

    steps:
      - name: Download wheels from build workflow
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.find-build.outputs.run-id }}
          pattern: pymol-*
          merge-multiple: true
          path: dist

      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          verbose: true
