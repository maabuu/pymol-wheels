name: build

on:
  workflow_dispatch:
    inputs:
      pymol_version:
        description: "PyMOL ref: dev (default branch), latest (newest version tag), tag, branch, or commit SHA"
        required: false
        default: "dev"
        type: string
      python_versions:
        description: "Python versions to build for (JSON list)"
        required: false
        default: '["3.11", "3.12", "3.13", "3.14"]'
        type: string

permissions:
  contents: read

# The build jobs follow the recipe of upstream's own CI
# (schrodinger/pymol-open-source: .github/workflows/build.yml): build with the
# C++ tests enabled, run the test suite, then build the wheel that is shipped.
# This recipe needs PyMOL sources newer than v3.1.0 (the `json` build option).
#
# Each wheel is then renamed to `pymol-open-source`, given the version resolved
# below, repaired so that it bundles its shared libraries, and finally installed
# and imported in a fresh environment that has none of the build dependencies.

jobs:
  # --------------------------
  # Resolve source and version metadata
  # --------------------------
  resolve:
    name: Resolve PyMOL source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      wheel_version: ${{ steps.metadata.outputs.wheel_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve PyMOL ref
        id: resolve-ref
        uses: actions/github-script@v9
        env:
          REQUESTED_REF: ${{ inputs.pymol_version }}
        with:
          script: |
            const owner = 'schrodinger';
            const repo = 'pymol-open-source';
            const requested = (process.env.REQUESTED_REF || '').trim() || 'dev';

            let ref = requested;
            if (requested === 'dev') {
              ref = (await github.rest.repos.get({ owner, repo })).data.default_branch;
            } else if (requested === 'latest') {
              // Upstream publishes version tags but no GitHub releases.
              const tags = await github.paginate(github.rest.repos.listTags, { owner, repo, per_page: 100 });
              const versions = tags
                .map((tag) => tag.name)
                .filter((name) => /^v\d+(\.\d+)*$/.test(name))
                .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
              if (versions.length === 0) {
                core.setFailed('No version tags found upstream');
                return;
              }
              ref = versions[versions.length - 1];
            } else if (/^\d+\.\d+(\.\d+)?$/.test(requested)) {
              ref = `v${requested}`;
            }

            core.notice(`Resolved PyMOL ref "${requested}" to "${ref}"`);
            core.setOutput('ref', ref);

      # Full history: the commit count is part of the development version.
      - name: Checkout PyMOL source
        uses: actions/checkout@v7
        with:
          repository: schrodinger/pymol-open-source
          ref: ${{ steps.resolve-ref.outputs.ref }}
          path: pymol-source
          fetch-depth: 0
          persist-credentials: false

      - name: Determine PyMOL build metadata
        id: metadata
        env:
          SOURCE_REF: ${{ steps.resolve-ref.outputs.ref }}
        run: |
          python3 .github/scripts/resolve_pymol_build_metadata.py \
            --repo-dir pymol-source \
            --json-out build-metadata/version.json \
            --source-ref "$SOURCE_REF"
          {
            echo '### PyMOL build metadata'
            echo '```json'
            cat build-metadata/version.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build metadata
        uses: actions/upload-artifact@v7
        with:
          name: build-metadata
          path: build-metadata/version.json
          if-no-files-found: error

  # --------------------------
  # Build Linux wheels
  # --------------------------
  linux:
    name: Linux x86_64 (py${{ matrix.python-version }})
    needs: resolve
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python_versions) }}

    env:
      WHEEL_VERSION: ${{ needs.resolve.outputs.wheel_version }}

    steps:
      - name: Get source
        uses: actions/checkout@v7
        with:
          repository: schrodinger/pymol-open-source
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get --no-install-recommends install \
              catch2 \
              libfreetype6-dev \
              libglew-dev \
              libglm-dev \
              libmsgpack-dev \
              libnetcdf-dev \
              nlohmann-json3-dev \
              libpng-dev \
              libxml2-dev

      - name: Get additional sources
        run: |
          git clone --depth 1 https://github.com/rcsb/mmtf-cpp.git
          cp -R mmtf-cpp/include/* include/

      - name: Build
        run: |
          pip install --upgrade pip
          pip install -v --config-settings testing=True --config-settings json=True '.[dev]'

      - name: Test
        run: pymol -ckqy testing/testing.py --run all

      - name: Build wheel
        run: pip wheel . --no-deps --wheel-dir dist --config-settings json=True

      - name: Rename and version wheel
        run: |
          pip install "wheel<0.45" wheeledit change-wheel-version
          wheeledit dist/pymol-*.whl --rename=pymol-open-source
          rm dist/pymol-*.whl
          if ! compgen -G "dist/pymol_open_source-${WHEEL_VERSION}-*.whl" > /dev/null; then
            python -m change_wheel_version dist/pymol_open_source-*.whl \
              --version "$WHEEL_VERSION" --delete-old-wheel
          fi

      - name: Repair wheel
        run: |
          pip install auditwheel patchelf
          auditwheel repair --wheel-dir wheelhouse dist/pymol_open_source-*.whl

      - name: Test repaired wheel
        timeout-minutes: 10
        env:
          TEST_PYTHON: python
        run: |
          "$TEST_PYTHON" -m venv "$RUNNER_TEMP/wheel-test"
          python="$RUNNER_TEMP/wheel-test/bin/python"
          [ -x "$python" ] || python="$RUNNER_TEMP/wheel-test/Scripts/python.exe"
          "$python" -m pip install wheelhouse/pymol_open_source-*.whl
          "$python" -I -c "from pymol import cmd; cmd.fragment('ala'); print('PyMOL', cmd.get_version()[0], '-', cmd.count_atoms(), 'atoms'); assert cmd.count_atoms() > 0"

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: pymol-linux-x86_64-py${{ matrix.python-version }}
          path: wheelhouse/pymol_open_source-*.whl
          if-no-files-found: error

  # --------------------------
  # Build Windows wheels
  # --------------------------
  windows:
    name: Windows x86_64 (py${{ matrix.python-version }})
    needs: resolve
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python_versions) }}

    env:
      WHEEL_VERSION: ${{ needs.resolve.outputs.wheel_version }}

    steps:
      - name: Get source
        uses: actions/checkout@v7
        with:
          repository: schrodinger/pymol-open-source
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          activate-environment: build
          channels: conda-forge
          conda-remove-defaults: true

      - name: Install dependencies
        run: >-
          conda install --yes
          catch2=2.13.3
          freetype
          glew
          glm
          libpng
          libxml2-devel
          libnetcdf
          nlohmann_json

      - name: Get additional sources
        run: |
          git clone --depth 1 https://github.com/rcsb/mmtf-cpp.git
          Copy-Item -Recurse -Path mmtf-cpp/include\* -Destination "$env:CONDA_PREFIX\Library\include"
          git clone --depth 1 --single-branch --branch cpp_master https://github.com/msgpack/msgpack-c.git
          Copy-Item -Recurse -Path msgpack-c/include\* -Destination "$env:CONDA_PREFIX\Library\include"

      - name: Build
        run: pip install -v --config-settings testing=True --config-settings json=True .[dev]

      - name: Test
        run: pymol -ckqy testing\testing.py --run all

      - name: Build wheel
        run: pip wheel . --no-deps --wheel-dir dist --config-settings json=True

      - name: Rename and version wheel
        shell: bash -el {0}
        run: |
          pip install "wheel<0.45" wheeledit change-wheel-version
          wheeledit dist/pymol-*.whl --rename=pymol-open-source
          rm dist/pymol-*.whl
          if ! compgen -G "dist/pymol_open_source-${WHEEL_VERSION}-*.whl" > /dev/null; then
            python -m change_wheel_version dist/pymol_open_source-*.whl \
              --version "$WHEEL_VERSION" --delete-old-wheel
          fi

      # Bundle the conda DLLs (libpng, freetype, GLEW, libxml2, netCDF, ...).
      - name: Install delvewheel
        run: pip install delvewheel

      - name: Repair wheel
        run: delvewheel repair -v --add-path "$env:CONDA_PREFIX\Library\bin" --wheel-dir wheelhouse dist\pymol_open_source-*.whl

      # A Python that knows nothing about the conda environment.
      - name: Set up Python for testing the wheel
        id: test-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          update-environment: false

      - name: Test repaired wheel
        shell: bash
        timeout-minutes: 10
        env:
          TEST_PYTHON: ${{ steps.test-python.outputs.python-path }}
        run: |
          "$TEST_PYTHON" -m venv "$RUNNER_TEMP/wheel-test"
          python="$RUNNER_TEMP/wheel-test/bin/python"
          [ -x "$python" ] || python="$RUNNER_TEMP/wheel-test/Scripts/python.exe"
          "$python" -m pip install wheelhouse/pymol_open_source-*.whl
          "$python" -I -c "from pymol import cmd; cmd.fragment('ala'); print('PyMOL', cmd.get_version()[0], '-', cmd.count_atoms(), 'atoms'); assert cmd.count_atoms() > 0"

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: pymol-windows-x86_64-py${{ matrix.python-version }}
          path: wheelhouse/pymol_open_source-*.whl
          if-no-files-found: error

  # --------------------------
  # Build macOS wheels
  # --------------------------
  macos:
    name: macOS ${{ matrix.arch }} (py${{ matrix.python-version }})
    needs: resolve
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python_versions) }}
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            runner: macos-26-intel
          - arch: arm64
            runner: macos-latest

    defaults:
      run:
        # Login shell, so that the conda environment is activated.
        shell: bash -el {0}

    env:
      WHEEL_VERSION: ${{ needs.resolve.outputs.wheel_version }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"

    steps:
      - name: Get source
        uses: actions/checkout@v7
        with:
          repository: schrodinger/pymol-open-source
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          activate-environment: build
          channels: conda-forge
          conda-remove-defaults: true

      # Upstream pins catch2=2.13.3, which has no osx-arm64 build.
      - name: Install dependencies
        run: >-
          conda install --yes
          catch2=2.13
          freetype
          glew
          glm
          libpng
          libxml2-devel
          libnetcdf
          nlohmann_json

      - name: Get additional sources
        run: |
          git clone --depth 1 https://github.com/rcsb/mmtf-cpp.git
          cp -R mmtf-cpp/include/* "${CONDA_PREFIX}/include/"
          git clone --depth 1 --single-branch --branch cpp_master https://github.com/msgpack/msgpack-c.git
          cp -R msgpack-c/include/* "${CONDA_PREFIX}/include/"

      - name: Build
        run: pip install -v --config-settings testing=True --config-settings json=True '.[dev]'

      - name: Test
        run: pymol -ckqy testing/testing.py --run all

      - name: Build wheel
        run: pip wheel . --no-deps --wheel-dir dist --config-settings json=True

      - name: Rename and version wheel
        run: |
          pip install "wheel<0.45" wheeledit change-wheel-version
          wheeledit dist/pymol-*.whl --rename=pymol-open-source
          rm dist/pymol-*.whl
          if ! compgen -G "dist/pymol_open_source-${WHEEL_VERSION}-*.whl" > /dev/null; then
            python -m change_wheel_version dist/pymol_open_source-*.whl \
              --version "$WHEEL_VERSION" --delete-old-wheel
          fi

      # Bundle the conda dylibs (libpng, freetype, GLEW, libxml2, netCDF, ...).
      - name: Repair wheel
        run: |
          pip install delocate
          delocate-wheel -v --sanitize-rpaths --wheel-dir wheelhouse dist/pymol_open_source-*.whl
          delocate-listdeps wheelhouse/pymol_open_source-*.whl

      # A Python that knows nothing about the conda environment.
      - name: Set up Python for testing the wheel
        id: test-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          update-environment: false

      - name: Test repaired wheel
        shell: bash
        timeout-minutes: 10
        env:
          TEST_PYTHON: ${{ steps.test-python.outputs.python-path }}
        run: |
          "$TEST_PYTHON" -m venv "$RUNNER_TEMP/wheel-test"
          python="$RUNNER_TEMP/wheel-test/bin/python"
          [ -x "$python" ] || python="$RUNNER_TEMP/wheel-test/Scripts/python.exe"
          "$python" -m pip install wheelhouse/pymol_open_source-*.whl
          "$python" -I -c "from pymol import cmd; cmd.fragment('ala'); print('PyMOL', cmd.get_version()[0], '-', cmd.count_atoms(), 'atoms'); assert cmd.count_atoms() > 0"

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: pymol-macos-${{ matrix.arch }}-py${{ matrix.python-version }}
          path: wheelhouse/pymol_open_source-*.whl
          if-no-files-found: error
