name: release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build workflow run ID (optional - will use latest successful if not provided)"
        required: false
        type: string

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Find build run
        id: find-build
        uses: ./.github/actions/find-build-run
        with:
          build_run_id: ${{ inputs.build_run_id }}

      - name: Download wheels from build workflow
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-build.outputs.run-id }}
          pattern: pymol-*
          merge-multiple: true
          path: release-assets

      - name: Download build metadata
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-build.outputs.run-id }}
          name: build-metadata
          path: metadata

      - name: Create GitHub release with wheels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          meta() { jq -r ".$1" metadata/version.json; }
          label=$(meta release_version_label)
          tag="pymol-${label}"

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::warning::Release ${tag} already exists, skipping creation"
            exit 0
          fi

          echo "Release assets:"
          ls -la release-assets/
          pythons=$(ls release-assets | sed -n 's/.*-cp3\([0-9]*\)-cp3.*/3.\1/p' | sort -u -t . -k 2,2n | paste -s -d , - | sed 's/,/, /g')

          cat > notes.md <<EOF
          PyMOL wheels built and ready for download.

          **Source:** https://github.com/schrodinger/pymol-open-source/
          **PyMOL ref:** \`$(meta source_ref)\`
          **PyMOL commit:** \`$(meta source_sha)\`
          **Upstream version:** \`$(meta upstream_version)\`
          **Wheel version:** \`$(meta wheel_version)\`

          ## Installation

          Download the wheel file for your platform and install with:
          \`\`\`bash
          pip install pymol_open_source-*.whl
          \`\`\`

          Or install from PyPI:
          \`\`\`bash
          pip install pymol-open-source
          \`\`\`

          ## What's included

          - Linux wheels (x86_64)
          - Windows wheels (x86_64)
          - macOS wheels (x86_64, arm64)
          - Python ${pythons} support

          Built automatically from PyMOL upstream source using official build instructions.
          EOF

          if [ "$(meta is_exact_release)" = "true" ]; then
            flags=(--latest)
          else
            flags=(--prerelease --latest=false)
          fi

          gh release create "$tag" release-assets/*.whl \
            --title "PyMOL ${label}" --notes-file notes.md "${flags[@]}"
